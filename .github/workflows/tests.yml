name: Run Tests
# Based on https://github.com/pyOpenSci/pyos-package-template/blob/main/template/%7B%25%20if%20use_git%20and%20dev_platform%20%3D%3D%20'GitHub'%20%25%7D.github%7B%25%20endif%20%25%7D/workflows/test.yml.jinja
# Run the test suite on pull requests and pushes to main branch
on:
  pull_request:
  push:

    branches:
      - main
  schedule:
    - cron: '0 23 * * Sun'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12","3.13","3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # This fetch element is only important if you are use SCM based
          # versioning (that looks at git tags to gather the version).
          # setuptools-scm needs tags to form a valid version number
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}  
          
      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Run test suite
        run: |
          hatch run +py=${{ matrix.python-version }} test:run

          
